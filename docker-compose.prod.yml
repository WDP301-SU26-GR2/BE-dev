x-default-logging: &default-logging
  # Bound container logs so a noisy service cannot exhaust the VPS disk.
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: mangaka-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    # Deploy by immutable registry digest, for example ghcr.io/org/mangaka-api@sha256:...
    image: ${API_IMAGE:?API_IMAGE immutable digest is required}
    container_name: mangaka-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      # Bật AI: chạy compose với `--profile ai` VÀ bỏ comment 2 dòng dưới (hoặc set trong .env).
      # AI_SERVICE_URL trỏ tới service name trong mạng compose; API key khớp ai-service bên dưới.
      # AI_SERVICE_URL: http://ai-service:8000
      # AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
    # Không expose port ra ngoài, đi qua caddy nội bộ
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    # Optional profile. Deploy tooling sets AI_IMAGE only when AI is enabled.
    # The disabled fallback is never pulled because this service is outside the default profile.
    profiles: ["ai"]
    image: ${AI_IMAGE:-ghcr.io/wdp301-su26-gr2/mangaka-ai:disabled}
    container_name: mangaka-ai
    restart: unless-stopped
    logging: *default-logging
    # RAM cap: cách ly AI khỏi api/redis trên VPS 2GB — vượt 1.2GB RAM thì tràn swap,
    # vượt 2.5GB (RAM+swap) thì kernel giết ĐÚNG container này (job FAILED sạch, BE không sao — AC3).
    mem_limit: 1200m
    memswap_limit: 2500m
    environment:
      API_KEY: ${AI_SERVICE_API_KEY}
      # Model paths đã bake sẵn trong ai-service/Dockerfile (/srv/models/...).
      # CONF_THRESHOLD optional — bỏ trống dùng mặc định của model.
      CONF_THRESHOLD: ${AI_CONF_THRESHOLD:-0.25}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    container_name: mangaka-prometheus
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  caddy:
    image: caddy:2-alpine
    container_name: mangaka-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  redis-data:
  prometheus-data:
  caddy-data:
  caddy-config:

